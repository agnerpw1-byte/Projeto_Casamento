<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Casamento</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>

<div class="app" id="app"></div>

<!-- Edit modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Editar item</h3>
    <div class="modal-fields">
      <div><label>Nome</label><input type="text" id="edit-nome" /></div>
      <div><label>Valor (R$)</label><input type="number" id="edit-valor" min="0" step="0.01" inputmode="decimal" /></div>
      <div><label>Prioridade</label>
        <select id="edit-prioridade">
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>
      </div>
      <div><label>Categoria</label>
        <select id="edit-categoria">
          <option>Cozinha</option><option>Sala</option><option>Quarto</option>
          <option>Banheiro</option><option>Eletrodoméstico</option>
          <option>Eletrônico</option><option>Decoração</option><option>Outros</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveEdit()">Salvar</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
